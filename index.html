<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="T Tracker">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>T Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg:       #07101c;
  --surface:  #0c1b2e;
  --surface2: #112340;
  --blue:     #1d4ed8;
  --cyan:     #22d3ee;
  --cyan-dim: rgba(34,211,238,0.12);
  --success:  #10b981;
  --warn:     #f59e0b;
  --danger:   #ef4444;
  --text:     #dbeafe;
  --text-dim: #5b8ab5;
  --border:   rgba(34,211,238,0.13);
  --mono:     'DM Mono', monospace;
  --display:  'Syne', sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  min-height: 100dvh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(34,211,238,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(34,211,238,0.025) 1px, transparent 1px);
  background-size: 44px 44px;
  pointer-events: none; z-index: 0;
}

.app {
  position: relative; z-index: 1;
  max-width: 430px; margin: 0 auto;
  padding-bottom: 90px;
}

/* HEADER */
.header {
  padding: 52px 20px 0;
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(180deg, rgba(7,16,28,0.97) 70%, transparent 100%);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.header-row {
  display: flex; align-items: flex-start; justify-content: space-between;
  padding-bottom: 10px;
}

.wordmark {
  font-family: var(--display);
  font-size: 26px; font-weight: 800;
  letter-spacing: -0.5px; line-height: 1;
}
.wordmark em { color: var(--cyan); font-style: normal; }

.badge {
  text-align: right;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px; padding: 5px 10px;
  font-size: 10px; line-height: 1.7; color: var(--cyan);
}

.status-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 0 12px;
  font-size: 11px; color: var(--text-dim);
  border-bottom: 1px solid var(--border);
}
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--text-dim); flex-shrink: 0;
  transition: background 0.3s, box-shadow 0.3s;
}
.dot.ok   { background: var(--success); box-shadow: 0 0 6px var(--success); }
.dot.busy { background: var(--warn); animation: blink 0.9s infinite; }
.dot.err  { background: var(--danger); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

.reset-btn {
  margin-left: auto;
  background: none; border: 1px solid var(--border);
  border-radius: 6px; padding: 3px 8px;
  color: var(--text-dim); font-family: var(--mono); font-size: 11px;
  cursor: pointer;
}

.tabs {
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.tab {
  flex: 1; padding: 11px 4px;
  font-family: var(--mono); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--text-dim);
  background: none; border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px; cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
.tab.active { color: var(--cyan); border-bottom-color: var(--cyan); }

/* SECTIONS */
.section { display: none; padding: 20px; }
.section.active { display: block; }

.label {
  font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--text-dim);
  margin-bottom: 6px; display: block;
}

/* NEXT CARD */
.next-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 18px;
  margin-bottom: 18px; position: relative; overflow: hidden;
}
.next-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--blue), var(--cyan));
}
.next-date {
  font-family: var(--display);
  font-size: 20px; font-weight: 700; margin-bottom: 2px;
}
.next-sub { font-size: 12px; color: var(--text-dim); }

/* PENDING BANNER */
.pending-banner {
  margin-bottom: 14px; padding: 10px 14px;
  background: rgba(245,158,11,0.08);
  border: 1px solid rgba(245,158,11,0.25);
  border-radius: 10px;
  font-size: 12px; color: var(--warn);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.pending-banner.hidden { display: none; }
.sync-btn {
  background: none; border: 1px solid rgba(245,158,11,0.4);
  border-radius: 6px; padding: 4px 10px;
  color: var(--warn); font-family: var(--mono); font-size: 11px;
  cursor: pointer; white-space: nowrap;
}

/* FORM */
.form-group { margin-bottom: 16px; }

.site-btns { display: flex; gap: 8px; }
.site-btn {
  flex: 1; padding: 13px 6px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text-dim);
  font-family: var(--mono); font-size: 13px;
  cursor: pointer; transition: all 0.15s; text-align: center;
}
.site-btn.active {
  background: var(--cyan-dim);
  border-color: var(--cyan); color: var(--cyan);
}

.text-field {
  width: 100%;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px;
  color: var(--text); font-family: var(--mono); font-size: 14px;
  outline: none; transition: border-color 0.2s;
  -webkit-appearance: none;
}
.text-field:focus { border-color: var(--cyan); }
.text-field::placeholder { color: var(--text-dim); }
input[type="date"].text-field { color-scheme: dark; }

.notes-field {
  width: 100%;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px;
  color: var(--text); font-family: var(--mono); font-size: 13px;
  outline: none; transition: border-color 0.2s;
  resize: none; height: 76px;
}
.notes-field:focus { border-color: var(--cyan); }
.notes-field::placeholder { color: var(--text-dim); }

.log-btn {
  width: 100%; padding: 16px;
  background: linear-gradient(135deg, #1d4ed8, #22d3ee);
  border: none; border-radius: 12px;
  color: #fff; font-family: var(--display);
  font-size: 16px; font-weight: 700;
  cursor: pointer; letter-spacing: 0.02em;
  transition: opacity 0.2s, transform 0.1s;
  margin-top: 4px;
}
.log-btn:active { transform: scale(0.98); opacity: 0.85; }
.log-btn:disabled { opacity: 0.35; cursor: not-allowed; }

/* STATS */
.stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px; margin-bottom: 18px;
}
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 10px; text-align: center;
}
.stat-num {
  font-family: var(--display);
  font-size: 30px; font-weight: 800;
  color: var(--cyan); line-height: 1;
}
.stat-label {
  font-size: 10px; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.07em; margin-top: 4px;
}

/* HISTORY */
.history-list { display: flex; flex-direction: column; gap: 8px; }

.history-item {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
}
.history-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--success); flex-shrink: 0;
  box-shadow: 0 0 6px var(--success);
}
.history-dot.pending { background: var(--text-dim); box-shadow: none; }
.history-info { flex: 1; min-width: 0; }
.history-date { font-size: 13px; font-weight: 500; }
.history-meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.history-badge {
  font-size: 10px; padding: 3px 8px;
  border-radius: 20px; white-space: nowrap; flex-shrink: 0;
}
.history-badge.done {
  background: rgba(16,185,129,0.12);
  border: 1px solid rgba(16,185,129,0.3);
  color: var(--success);
}
.history-badge.pending {
  background: rgba(91,138,181,0.1);
  border: 1px solid var(--border); color: var(--text-dim);
}

.empty-state {
  text-align: center; padding: 40px 20px;
  color: var(--text-dim); font-size: 13px;
}

/* TOAST */
.toast {
  position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 20px;
  font-size: 13px; color: var(--text);
  opacity: 0; transition: opacity 0.3s;
  pointer-events: none; white-space: nowrap; z-index: 999;
}
.toast.show    { opacity: 1; }
.toast.success { border-color: var(--success); color: var(--success); }
.toast.error   { border-color: var(--danger);  color: var(--danger); }

/* URL MODAL */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(7,16,28,0.92);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.modal-overlay.hidden { display: none; }
.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 28px 24px; width: 100%; max-width: 380px;
}
.modal-title {
  font-family: var(--display); font-size: 20px; font-weight: 700; margin-bottom: 8px;
}
.modal-sub {
  font-size: 12px; color: var(--text-dim); margin-bottom: 20px; line-height: 1.7;
}
.modal-input {
  width: 100%;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px;
  color: var(--text); font-family: var(--mono); font-size: 12px;
  outline: none; margin-bottom: 12px;
}
.modal-input:focus { border-color: var(--cyan); }
.modal-input::placeholder { color: var(--text-dim); }
.modal-save {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg, #1d4ed8, #22d3ee);
  border: none; border-radius: 10px;
  color: #fff; font-family: var(--display);
  font-size: 15px; font-weight: 700; cursor: pointer;
}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-row">
      <div class="wordmark">T<em>.</em>Tracker</div>
      <div class="badge">125mg weekly<br>IM / Glute</div>
    </div>
    <div class="status-bar">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">Connecting...</span>
      <button class="reset-btn" onclick="promptUrl()">Reset URL</button>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="showTab('log')">Log</button>
      <button class="tab" onclick="showTab('history')">History</button>
    </div>
  </div>

  <!-- LOG -->
  <div class="section active" id="tab-log">
    <div class="next-card">
      <div class="label">Next injection</div>
      <div class="next-date" id="nextDate">-</div>
      <div class="next-sub" id="nextSub">-</div>
    </div>

    <div id="pendingBanner" class="pending-banner hidden">
      <span id="pendingText"></span>
      <button class="sync-btn" onclick="syncPending()">Sync now</button>
    </div>

    <div class="form-group">
      <label class="label">Date</label>
      <input type="date" class="text-field" id="injDate">
    </div>
    <div class="form-group">
      <label class="label">Site</label>
      <div class="site-btns">
        <button class="site-btn active" id="btn-lg" onclick="selectSite('Left glute')">Left glute</button>
        <button class="site-btn"        id="btn-rg" onclick="selectSite('Right glute')">Right glute</button>
      </div>
    </div>
    <div class="form-group">
      <label class="label">Administered by</label>
      <input type="text" class="text-field" id="injBy" value="CAB" placeholder="Self / Carey / Clinic">
    </div>
    <div class="form-group">
      <label class="label">Notes (optional)</label>
      <textarea class="notes-field" id="injNotes" placeholder="Any observations, reactions, reminders..."></textarea>
    </div>
    <button class="log-btn" id="logBtn" onclick="logInjection()">LOG INJECTION</button>
  </div>

  <!-- HISTORY -->
  <div class="section" id="tab-history">
    <div class="stats">
      <div class="stat-card"><div class="stat-num" id="statDone">-</div><div class="stat-label">Done</div></div>
      <div class="stat-card"><div class="stat-num" id="statRemaining">-</div><div class="stat-label">Left</div></div>
      <div class="stat-card"><div class="stat-num">52</div><div class="stat-label">Total</div></div>
    </div>
    <div class="history-list" id="historyList">
      <div class="empty-state">Loading...</div>
    </div>
  </div>

</div>

<!-- URL MODAL -->
<div class="modal-overlay hidden" id="urlModal">
  <div class="modal">
    <div class="modal-title">Connect to Google Sheets</div>
    <div class="modal-sub">
      Paste your Apps Script web app URL below.<br>
      Extensions > Apps Script > Deploy > Web app.<br>
      You only need to do this once per device.
    </div>
    <input type="url" class="modal-input" id="modalUrlInput"
      placeholder="https://script.google.com/macros/s/.../exec">
    <button class="modal-save" onclick="saveUrlFromModal()">Connect</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const START = new Date('2026-05-03');
const TOTAL = 52;
const SITES = ['Left glute', 'Right glute'];

function getSchedule() {
  return Array.from({ length: TOTAL }, (_, i) => {
    const d = new Date(START);
    d.setDate(d.getDate() + i * 7);
    return { num: i + 1, date: fmtDate(d), site: SITES[i % 2] };
  });
}

function fmtDate(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function parseDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function displayDate(s) {
  return parseDate(s).toLocaleDateString('en-AU', {
    weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
  });
}

const KEY_URL     = 'tt_url';
const KEY_PENDING = 'tt_pending';
const KEY_CACHE   = 'tt_cache';

const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbwqr-x5meU2srYaXMSsiEM16MHOUVaRWQVe47OfnVQtginnC8MJkjfaT-APDIuOQLCgnA/exec';
const getUrl     = () => localStorage.getItem(KEY_URL) || DEFAULT_URL;
const getPending = () => JSON.parse(localStorage.getItem(KEY_PENDING) || '[]');
const getCache   = () => JSON.parse(localStorage.getItem(KEY_CACHE)   || '[]');
const savePending = a  => localStorage.setItem(KEY_PENDING, JSON.stringify(a));
const saveCache   = a  => localStorage.setItem(KEY_CACHE,   JSON.stringify(a));

let selectedSite = 'Left glute';
function selectSite(s) {
  selectedSite = s;
  document.getElementById('btn-lg').classList.toggle('active', s === 'Left glute');
  document.getElementById('btn-rg').classList.toggle('active', s === 'Right glute');
}

function updateNextCard() {
  const doneDates = new Set(
    getCache().filter(r => r.done === 'Y' || r.done === true).map(r => r.date)
  );
  const today = fmtDate(new Date());
  const next  = getSchedule().find(s => !doneDates.has(s.date) && s.date >= today);
  if (next) {
    document.getElementById('nextDate').textContent = displayDate(next.date);
    document.getElementById('nextSub').textContent  =
      'Injection ' + next.num + ' of ' + TOTAL + ' - ' + next.site;
    document.getElementById('injDate').value = next.date;
    selectSite(next.site);
  } else {
    document.getElementById('nextDate').textContent = 'All done!';
    document.getElementById('nextSub').textContent  = 'Programme complete.';
  }
}

function renderHistory() {
  const sheetMap = {};
  getCache().forEach(r => { sheetMap[r.date] = r; });
  getPending().forEach(r => {
    if (!sheetMap[r.date]) sheetMap[r.date] = { ...r, done: 'Y', _pending: true };
  });

  let done = 0, remaining = 0;
  const items = getSchedule().map(s => {
    const rec    = sheetMap[s.date] || null;
    const isDone = rec && (rec.done === 'Y' || rec.done === true);
    if (isDone) done++; else remaining++;
    return { ...s, rec, isDone };
  });

  document.getElementById('statDone').textContent      = done;
  document.getElementById('statRemaining').textContent = remaining;

  const sorted = [
    ...items.filter(i => i.isDone).reverse(),
    ...items.filter(i => !i.isDone)
  ];

  document.getElementById('historyList').innerHTML = sorted.map(item => {
    const meta = item.isDone
      ? [item.rec.site || item.site, item.rec.by, item.rec.notes,
         item.rec._pending ? '(pending sync)' : ''].filter(Boolean).join(' - ')
      : item.site;
    return `<div class="history-item">
      <div class="history-dot ${item.isDone ? '' : 'pending'}"></div>
      <div class="history-info">
        <div class="history-date">${displayDate(item.date)}</div>
        <div class="history-meta">${meta}</div>
      </div>
      <div class="history-badge ${item.isDone ? 'done' : 'pending'}">
        ${item.isDone ? 'done' : '#' + item.num}
      </div>
    </div>`;
  }).join('');
}

function updatePendingBanner() {
  const p = getPending();
  document.getElementById('pendingText').textContent =
    p.length + ' unsynced injection' + (p.length !== 1 ? 's' : '');
  document.getElementById('pendingBanner').classList.toggle('hidden', p.length === 0);
}

async function logInjection() {
  const date  = document.getElementById('injDate').value;
  const by    = document.getElementById('injBy').value.trim() || 'self';
  const notes = document.getElementById('injNotes').value.trim();
  if (!date) { showToast('Pick a date first', 'error'); return; }

  const record = { date, site: selectedSite, dose: 0.5, by, notes };

  // Update local cache optimistically
  const cache = getCache();
  const idx   = cache.findIndex(r => r.date === date);
  const entry = { ...record, done: 'Y' };
  if (idx > -1) cache[idx] = { ...cache[idx], ...entry }; else cache.push(entry);
  saveCache(cache);

  document.getElementById('injNotes').value = '';
  updateNextCard();
  renderHistory();

  if (!getUrl()) {
    const p = getPending(); p.push(record); savePending(p);
    updatePendingBanner();
    showToast('Saved locally - no backend set', 'success');
    return;
  }
  await pushRecord(record);
}

async function pushRecord(record) {
  const btn = document.getElementById('logBtn');
  btn.disabled = true; btn.textContent = 'SAVING...';
  setStatus('busy', 'Syncing...');
  try {
    const res  = await fetch(getUrl(), { method: 'POST', body: JSON.stringify(record) });
    const data = await res.json();
    if (data.status === 'ok') {
      showToast('Logged and synced', 'success');
      setStatus('ok', 'Synced');
      await pullHistory();
    } else throw new Error(data.error || 'Error');
  } catch {
    const p = getPending(); p.push(record); savePending(p);
    updatePendingBanner();
    showToast('Saved locally - will sync later', 'error');
    setStatus('err', 'Offline - queued');
  } finally {
    btn.disabled = false; btn.textContent = 'LOG INJECTION';
  }
}

async function syncPending() {
  const pending = getPending();
  if (!pending.length) { showToast('Nothing to sync', ''); return; }
  if (!getUrl())       { showToast('No backend URL set', 'error'); return; }
  setStatus('busy', 'Syncing ' + pending.length + '...');
  const failed = [];
  for (const r of pending) {
    try {
      const res  = await fetch(getUrl(), { method: 'POST', body: JSON.stringify(r) });
      const data = await res.json();
      if (data.status !== 'ok') throw new Error();
    } catch { failed.push(r); }
  }
  savePending(failed);
  updatePendingBanner();
  if (!failed.length) {
    setStatus('ok', 'All synced'); showToast('All synced', 'success'); await pullHistory();
  } else {
    setStatus('err', failed.length + ' failed'); showToast(failed.length + ' failed', 'error');
  }
}

function setStatus(state, msg) {
  document.getElementById('statusDot').className    = 'dot ' + state;
  document.getElementById('statusText').textContent = msg;
}

async function checkBackend() {
  if (!getUrl()) { setStatus('err', 'No backend - tap Reset URL'); return; }
  setStatus('busy', 'Connecting...');
  try {
    const res  = await fetch(getUrl() + '?ping=1');
    const data = await res.json();
    if (data.status === 'ok') { setStatus('ok', 'Connected'); await pullHistory(); }
    else throw new Error();
  } catch { setStatus('err', 'Offline - using local cache'); }
}

async function pullHistory() {
  if (!getUrl()) return;
  try {
    const res  = await fetch(getUrl() + '?action=list');
    const data = await res.json();
    if (data.status === 'ok' && Array.isArray(data.data)) {
      saveCache(data.data);
      renderHistory();
      updateNextCard();
    }
  } catch { /* use cache */ }
}

function promptUrl() {
  document.getElementById('modalUrlInput').value = getUrl();
  document.getElementById('urlModal').classList.remove('hidden');
}

function saveUrlFromModal() {
  const val = document.getElementById('modalUrlInput').value.trim();
  if (!val) { showToast('Paste the URL first', 'error'); return; }
  localStorage.setItem(KEY_URL, val);
  document.getElementById('urlModal').classList.add('hidden');
  showToast('Connected!', 'success');
  checkBackend();
}

function showTab(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.querySelectorAll('.tab')[name === 'log' ? 0 : 1].classList.add('active');
  if (name === 'history') renderHistory();
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('injDate').value = fmtDate(new Date());
  updateNextCard();
  renderHistory();
  updatePendingBanner();

  checkBackend();

  window.addEventListener('online',  () => { setStatus('busy', 'Back online...'); syncPending().then(checkBackend); });
  window.addEventListener('offline', () => setStatus('err', 'Offline - logging locally'));
});
</script>
